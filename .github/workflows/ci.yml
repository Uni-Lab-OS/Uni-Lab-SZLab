name: Validate device integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout product OS authoring contract
        uses: actions/checkout@v6
        with:
          repository: Uni-Lab-OS/Uni-Lab-OS
          ref: product/durable-scheduler-kernel
          path: .ci/Uni-Lab-OS
      - name: Setup Uni-Lab environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: "3.11.14"
          channels: conda-forge,robostack-staging,uni-lab,defaults
          channel-priority: flexible
          activate-environment: unilab
          auto-update-conda: false
      - name: Install Uni-Lab-OS and test tools
        shell: bash -el {0}
        run: |
          mamba install -n unilab uni-lab::unilabos -c uni-lab -c robostack-staging -c conda-forge -y
          python -m pip install --no-deps -e .
          python -m pip install pytest jsonschema PyYAML ruff
      - name: Check external package
        shell: bash -el {0}
        run: ./scripts/check-package.sh
      - name: Check workflow authoring contract against product OS
        shell: bash -el {0}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          UNILAB_OS_ROOT: ${{ github.workspace }}/.ci/Uni-Lab-OS
          PYTHONPATH: ${{ github.workspace }}/.ci/Uni-Lab-OS:${{ github.workspace }}
        run: python -m pytest tests/test_workflow_authoring_contract.py
      - name: Run integration tests
        shell: bash -el {0}
        run: python -m pytest
      - name: Lint maintained Python
        shell: bash -el {0}
        run: python -m ruff check szlab_poly_studio tests tools
