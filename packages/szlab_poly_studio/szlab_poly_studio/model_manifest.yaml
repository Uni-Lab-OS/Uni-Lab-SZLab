schema_version: 1

bundle:
  id: szlab-poly-studio
  display_name: SZLab 聚合物工作站模型包
  source_namespace: szlab

# Mesh/XACRO/GLB files are not checked in yet. Place runtime assets under
# devices/<key>/ and resources/<key>/ relative to this package, then reinstall
# the wheel. MaterialModelRegistry skips missing entries and activates them
# once the files exist.

models:
  - key: szlab_poly_studio
    display_name: SZLab 聚合物工作站整机
    applies_to:
      - kind: resource
        class: szlab_poly_studio_deck
    representations:
      web:
        format: gltf
        entry: devices/szlab_poly_studio/workcell.glb
      kinematics:
        format: xacro
        entry: devices/szlab_poly_studio/macro_device.xacro
        macro: szlab_poly_studio
    coordinates:
      units: meter
      up_axis: z

  - key: szlab_mixer_robot
    display_name: SZLab 搬运机械臂
    applies_to:
      - kind: device
        class: szlab_mixer_robot
    representations:
      web:
        format: xacro
        entry: devices/szlab_mixer_robot/macro_device.xacro
        macro: szlab_mixer_robot
      kinematics:
        format: xacro
        entry: devices/szlab_mixer_robot/macro_device.xacro
        macro: szlab_mixer_robot
    coordinates:
      units: meter
      up_axis: z

  - key: szlab_mixer_stirrer
    display_name: SZLab 磁力搅拌工位
