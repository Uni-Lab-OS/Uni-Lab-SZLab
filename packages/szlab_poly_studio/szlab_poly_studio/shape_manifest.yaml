# SZLab 聚合物工作站的 2.5D 外形声明。
#
# 前端只是图元解释器：这里的 parts 按数组顺序由后向前绘制，style 只能取
# schemas/shape-manifest-v1.schema.json 里的通用词表。坐标单位 mm，原点在
# 占位左下角底面（与图节点 position 同一约定）；units: ratio 的图元按实例
# 宽/深/高归一，直径按 min(宽, 深) 归一。
#
# 工站几何来自《理论交点测距结果.xlsx》记录的落位点 + 对应 CAD STL 包围盒，
# 器皿轮廓来自各自的 CAD 回转剖面。envelope 同时是导出脚本写进图里的 size。
schema_version: 1
bundle:
  id: szlab-poly-studio
  display_name: SZLab 聚合物工作站
  source_namespace: szlab

shapes:
  # ------------------------------------------------------------------ 工站设备
  - id: carousel_feeder
    display_name: S07 固体加料（注粉装置）
    applies_to:
      - category: carousel_feeder
    envelope: [770.0, 503.0, 654.5]
    note: >-
      模型 Y 朝上导出，台面上转 90° 摆放（长边沿 X）。双层 Ø456 转盘绕中心
      Ø91 立柱，上盘 10 个 Ø62 工位孔（r=185），后侧料斗方箱上接 Ø80 圆筒。
    parts:
      - { type: box, style: foot, from: [20.12, 20.12, 0.0], to: [45.27, 45.27, 55.0] }
      - { type: box, style: foot, from: [724.73, 20.12, 0.0], to: [749.88, 45.27, 55.0] }
      - { type: box, style: foot, from: [20.12, 457.73, 0.0], to: [45.27, 482.88, 55.0] }
      - { type: box, style: foot, from: [724.73, 457.73, 0.0], to: [749.88, 482.88, 55.0] }
      - { type: slab, style: plate, z: [55.0, 75.0] }
      - { type: cylinder, style: shaft, center: [231.0, 251.0], d: 91.0, z: [75.0, 379.5] }
      - { type: cylinder, style: deck, center: [231.0, 251.0], d: 456.0, z: [258.5, 270.5] }
      - { type: cylinder, style: deck, center: [231.0, 251.0], d: 456.0, z: [367.5, 379.5] }
      - { type: disc, style: bore, center: [231.0, 251.0], d: 91.0, z: 379.5 }
      # 上盘 10 个工位孔，r=185 均分一圈（36° 一格）
      - { type: disc, style: port, center: [416.0, 251.0], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [380.668, 359.74], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [288.168, 426.946], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [173.832, 426.946], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [81.332, 359.74], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [46.0, 251.0], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [81.332, 142.26], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [173.832, 75.054], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [288.168, 75.054], d: 62.0, z: 379.5 }
      - { type: disc, style: port, center: [380.668, 142.26], d: 62.0, z: 379.5 }
      - { type: box, style: body, from: [478.0, 90.0, 75.0], to: [719.0, 450.0, 352.0] }
      - { type: cylinder, style: body, center: [598.5, 270.0], d: 80.0, z: [352.0, 420.0] }
      - { type: cylinder, style: shaft, center: [231.0, 251.0], d: 91.0, z: [379.5, 430.0] }
      - { type: box, style: module, from: [207.0, 210.0, 430.0], to: [447.0, 308.0, 654.5] }

  - id: gantry_pump
    display_name: S06 注射泵（溶剂加样）
    applies_to:
      - category: gantry_pump
    envelope: [285.0, 205.0, 727.0]
    note: >-
      底板站在 4 根 Ø11 抛光立柱上，中层平台 z=288..303；背面两块 12 厚立板
      顶到 556、上端一道 29 深横梁，梁下伸出加样臂，臂下挂 Ø12 加样针；顶部
      两台泵模组各坐在一块占满宽度的安装板上。立板朝 +Y，加样针朝台面前侧。
    parts:
      - { type: box, style: plate, from: [42.5, 0.0, 0.0], to: [242.5, 190.0, 12.0] }
      - { type: cylinder, style: shaft, center: [60.5, 171.0], d: 11.0, z: [12.0, 288.0] }
      - { type: cylinder, style: shaft, center: [230.5, 171.0], d: 11.0, z: [12.0, 288.0] }
      - { type: cylinder, style: shaft, center: [60.5, 11.0], d: 11.0, z: [12.0, 288.0] }
      - { type: cylinder, style: shaft, center: [230.5, 11.0], d: 11.0, z: [12.0, 288.0] }
      - { type: box, style: plate, from: [32.5, 0.0, 288.0], to: [252.5, 204.0, 303.0] }
      - { type: box, style: column, from: [32.5, 190.0, 303.0], to: [92.5, 202.0, 556.0] }
      - { type: box, style: column, from: [192.5, 190.0, 303.0], to: [252.5, 202.0, 556.0] }
      - { type: box, style: column, from: [32.5, 173.0, 510.0], to: [252.5, 202.0, 556.0] }
      - { type: box, style: column, from: [55.5, 64.5, 303.0], to: [82.5, 100.5, 335.0] }
      - { type: cylinder, style: probe, center: [144.5, 97.0], d: 12.0, z: [303.0, 430.0] }
      - { type: box, style: module, from: [131.0, 85.0, 430.0], to: [158.0, 205.0, 500.0] }
      - { type: box, style: plate, from: [0.0, 0.0, 556.0], to: [285.0, 190.0, 568.0] }
      - { type: box, style: module, from: [16.5, 36.5, 568.0], to: [269.5, 148.5, 633.0] }
      - { type: box, style: plate, from: [0.0, 0.0, 649.0], to: [285.0, 190.0, 661.0] }
      - { type: box, style: module, from: [16.5, 36.5, 661.0], to: [269.5, 148.5, 726.0] }

  - id: stirrer_rack
    display_name: S04 磁搅（磁搅模块）
    applies_to:
      - category: stirrer_rack
    envelope: [710.0, 359.0, 780.0]
    note: >-
      敞口柜前面朝 -Y。两层 × 3 台加热搅拌台对应 PLC 的 S041..S046：地板顶面
      z=10/395 承搅拌器，层板 z=140..150 / 525..535 与搅拌器顶盖齐平，Ø86 的
      500 mL 烧杯落在顶盖上。
    parts:
      - { type: box, style: frame, from: [0.0, 35.9, 0.0], to: [10.0, 347.4, 780.0] }
      - { type: box, style: frame, from: [700.0, 35.9, 0.0], to: [710.0, 347.4, 780.0] }
      # 第一层
      - { type: box, style: board, from: [10.0, 17.4, 0.0], to: [700.0, 347.4, 10.0] }
      - { type: box, style: body, from: [23.3, 0.0, 10.0], to: [238.9, 359.0, 140.0] }
      - { type: box, style: body, from: [248.3, 0.0, 10.0], to: [463.9, 359.0, 140.0] }
      - { type: box, style: body, from: [473.3, 0.0, 10.0], to: [688.9, 359.0, 140.0] }
      - { type: box, style: board, from: [10.0, 17.4, 140.0], to: [700.0, 347.4, 150.0] }
      - { type: rect, style: pad, from: [72.1, 69.4], to: [198.1, 195.4], z: 150.0 }
      - { type: rect, style: pad, from: [297.1, 69.4], to: [423.1, 195.4], z: 150.0 }
      - { type: rect, style: pad, from: [522.1, 69.4], to: [648.1, 195.4], z: 150.0 }
      - { type: disc, style: seat, center: [135.1, 132.4], d: 86.0, z: 150.0 }
      - { type: disc, style: seat, center: [360.1, 132.4], d: 86.0, z: 150.0 }
      - { type: disc, style: seat, center: [585.1, 132.4], d: 86.0, z: 150.0 }
      # 第二层（层间距 385）
      - { type: box, style: board, from: [10.0, 17.4, 385.0], to: [700.0, 347.4, 395.0] }
      - { type: box, style: body, from: [23.3, 0.0, 395.0], to: [238.9, 359.0, 525.0] }
      - { type: box, style: body, from: [248.3, 0.0, 395.0], to: [463.9, 359.0, 525.0] }
      - { type: box, style: body, from: [473.3, 0.0, 395.0], to: [688.9, 359.0, 525.0] }
      - { type: box, style: board, from: [10.0, 17.4, 525.0], to: [700.0, 347.4, 535.0] }
      - { type: rect, style: pad, from: [72.1, 69.4], to: [198.1, 195.4], z: 535.0 }
      - { type: rect, style: pad, from: [297.1, 69.4], to: [423.1, 195.4], z: 535.0 }
      - { type: rect, style: pad, from: [522.1, 69.4], to: [648.1, 195.4], z: 535.0 }
      - { type: disc, style: seat, center: [135.1, 132.4], d: 86.0, z: 535.0 }
      - { type: disc, style: seat, center: [360.1, 132.4], d: 86.0, z: 535.0 }
      - { type: disc, style: seat, center: [585.1, 132.4], d: 86.0, z: 535.0 }
      - { type: box, style: board, from: [10.0, 17.4, 770.0], to: [700.0, 347.4, 780.0] }

  - id: vision_cell
    display_name: S05 拍照检测（视觉检测模块）
    applies_to:
      - category: vision_cell
    envelope: [340.0, 329.0, 510.0]
    note: >-
      框架前后敞开供机械臂取放，探出的减速电机侧臂不计占位也不画。Ø251 转盘
      台面比框架深、前后各探出一截；台面下是 Ø234 齿盘、轴承安装板与驱动电机，
      顶板下吊相机，Ø33 镜头正对转盘中心 (170, 127.5)。
    parts:
      - { type: box, style: frame, from: [0.0, 27.5, 0.0], to: [10.0, 227.5, 510.0] }
      - { type: box, style: frame, from: [330.0, 27.5, 0.0], to: [340.0, 227.5, 510.0] }
      - { type: box, style: board, from: [0.0, 27.5, 0.0], to: [340.0, 227.5, 10.0] }
      - { type: box, style: motor, from: [125.0, 82.5, 10.0], to: [215.0, 172.5, 100.0] }
      - { type: box, style: board, from: [60.0, 27.5, 100.0], to: [280.0, 227.5, 112.0] }
      - { type: cylinder, style: shaft, center: [170.0, 127.5], d: 90.0, z: [112.0, 148.0] }
      - { type: cylinder, style: gear, center: [170.0, 127.5], d: 234.0, z: [130.0, 148.0] }
      - { type: cylinder, style: deck, center: [170.0, 127.5], d: 251.0, z: [148.0, 162.0] }
      - { type: cylinder, style: shaft, center: [170.0, 127.5], d: 33.0, z: [357.0, 400.0] }
      - { type: box, style: board, from: [135.0, 36.5, 400.0], to: [205.0, 144.0, 500.0] }
      - { type: box, style: board, from: [10.0, 27.5, 500.0], to: [330.0, 227.5, 510.0] }

  - id: rail_robot
    display_name: SZLab 机械臂（含行走轴）
    applies_to:
      - category: rail_robot
    envelope: [2700.0, 160.0, 208.15]
    note: >-
      占位就是 B17H_L50_S2700 行走轴本体（导轨顶面 z=208.15）。臂体沿导轨可移动，
      这里画在左端 x=210 处仅作示意，臂体包络 420 × 420 × 850。
    parts:
      - { type: slab, style: plate, z: [0.0, 114.4825] }
      - { type: slab, style: beam, z: [114.4825, 208.15] }
      - { type: box, style: module, from: [0.0, -130.0, 208.15], to: [420.0, 290.0, 361.15] }
      - { type: box, style: shell, from: [113.4, -16.6, 361.15], to: [306.6, 176.6, 1058.15] }

  # -------------------------------------------------------------- 敞口层架堆栈
  # 层板高度与位点都由实例的 config.sites 决定，声明只表明「这是敞口层架」。
  - id: beaker_stack
    display_name: 烧杯堆栈
    applies_to:
      - category: beaker_stack
    sort: rear-edge
    parts:
      - { type: sites, generator: open-rack }

  - id: reagent_stack
    display_name: 试剂瓶堆栈
    applies_to:
      - category: reagent_stack
    sort: rear-edge
    parts:
      - { type: sites, generator: open-rack }

  - id: powder_stack
    display_name: 固体粉桶堆栈
    applies_to:
      - category: powder_stack
    priority: 20
    sort: rear-edge
    parts:
      - { type: sites, generator: open-rack }

  - id: tip_stack
    display_name: TIP 头堆栈 / 上料过渡仓
    applies_to:
      - category: tip_stack
    sort: rear-edge
    parts:
      - { type: sites, generator: open-rack }

  # ------------------------------------------------------------------ 器皿与耗材
  - id: tip_box
    display_name: TIP 盒组件
    applies_to:
      - category: tip_box
    envelope: [86.0, 128.0, 136.0]
    units: ratio
    note: >-
      底托 + 四角立柱 + 近顶部的孔板（顶面 113/136），枪头孔与孔上的枪头由
      位点生成。上料过渡仓里的盒子转了 90°，所以用归一坐标而不是 mm。
    parts:
      - { type: box, style: shell, from: [0.0, 1.0, 0.06], to: [0.09, 1.0, 0.756882] }
      - { type: box, style: shell, from: [0.91, 1.0, 0.06], to: [1.0, 1.0, 0.756882] }
      - { type: slab, style: plain, z: [0.0, 0.06] }
      - { type: box, style: plate, from: [0.0, 0.0, 0.06], to: [0.09, 0.0, 0.756882] }
      - { type: box, style: plate, from: [0.91, 0.0, 0.06], to: [1.0, 0.0, 0.756882] }
      - { type: slab, style: plain, z: [0.756882, 0.830882] }
      - { type: sites, generator: site-holes }

  - id: powder_container
    display_name: 注粉瓶
    applies_to:
      - category: powder_reagent
    # 与通用试剂瓶抢 category 时要赢：powder_reagent 是锥形料斗，不是旋盖瓶
    priority: 10
    envelope: [70.0, 70.0, 190.0]
    units: ratio
    shadow: round
    note: >-
      回转剖面取自 CAD 注粉瓶-20260508（Ø70 × 190）：下端出料嘴 → 锥体 →
      带凹槽的法兰段 → 顶部阀杆。
    parts:
      - type: lathe
        style: glass
        center: [0.5, 0.5]
        d: 1.0
        z: [0.0, 1.0]
        mouth: true
        rings:
          - { z: 0.0, r: 0.32 }
          - { z: 0.026, r: 0.26 }
          - { z: 0.053, r: 0.49 }
          - { z: 0.132, r: 0.49 }
          - { z: 0.221, r: 0.73 }
          - { z: 0.316, r: 0.81 }
          - { z: 0.395, r: 0.96 }
          - { z: 0.526, r: 1.0 }
          - { z: 0.537, r: 0.76 }
          - { z: 0.579, r: 0.76 }
          - { z: 0.589, r: 1.0 }
          - { z: 0.711, r: 0.99 }
          - { z: 0.726, r: 0.64 }
          - { z: 0.832, r: 0.49 }
          - { z: 0.895, r: 0.49 }
          - { z: 0.905, r: 0.29 }
          - { z: 1.0, r: 0.29 }
