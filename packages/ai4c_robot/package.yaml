schema_version: 1
profile_id: ai4c_robot
description: AI4C PLC 与机械臂外部设备包和 Python 调试工作流
device_spec: ../../specs/ai4c_robot.yaml
default_device_binding:
  device_id: ai4c_station
  driver_key: generic_plc_macro
  connection_ref: AI4C_PLC_CONNECTION
resource_topology:
  resources:
    - {id: ai4c_station, resource_type: device}
    - {id: AI4C_plc, resource_type: device}
    - {id: AI4C_robot_arm, resource_type: robotic_arm}
    - {id: loading_rack, resource_type: well_plate_rack}
    - {id: pipetting_station, resource_type: pipetting_station}
    - {id: magnetic_stirrer, resource_type: magnetic_stirrer}
    - {id: hplc_station, resource_type: hplc_station}
    - {id: unloading_rack, resource_type: well_plate_rack}
driver_config:
  macros:
    pick_well_plate_from_loading_rack:
      - {call: pick_well_plate_from_loading_rack, args: [{input: position}]}
    place_well_plate_to_pipetting_station:
      - {call: place_well_plate_to_pipetting_station}
    pick_well_plate_from_pipetting_station:
      - {call: pick_well_plate_from_pipetting_station}
    place_well_plate_to_magnetic_stirrer:
      - {call: place_well_plate_to_magnetic_stirrer}
    pick_well_plate_from_magnetic_stirrer:
      - {call: pick_well_plate_from_magnetic_stirrer}
    place_well_plate_to_hplc_station:
      - {call: place_well_plate_to_hplc_station}
    pick_well_plate_from_hplc_station:
      - {call: pick_well_plate_from_hplc_station}
    place_well_plate_to_unloading_rack:
      - {call: place_well_plate_to_unloading_rack, args: [{input: position}]}
workflow_importers:
  - {schema: unilab.python/v1, kind: workflow, codec: python_ast_v1}
