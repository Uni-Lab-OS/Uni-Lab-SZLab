schema_version: 2
device:
  id: ai4c_station
  display_name: AI4C 自动化工作站
  category: [workstation, material_transport]
actions:
  - &rack_action
    id: pick_well_plate_from_loading_rack
    description: 从上料架指定位置取孔板。
    execution_kind: device_macro
    params:
      - {name: position, type: integer, required: true, minimum: 1, maximum: 8}
    results: [{name: success, type: boolean}]
    material:
      mode: move
      inputs: [{name: plate, resource_type: well_plate}]
      outputs:
        - {name: plate, resource_type: well_plate, same_identity_as: plate}
    resource_claims:
      - {resource_ref: AI4C_robot_arm, resource_type: robotic_arm, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 30, timeout_s: 300}
    recovery: &ai4c_recovery
      idempotency: reconcile_before_retry
      cancel: reconcile_required
      timeout: reconcile_required
      disconnect: reconcile_required
      estop: needs_drain

  - id: place_well_plate_to_pipetting_station
    description: 将孔板放到移液站。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: &plate_move
      mode: move
      inputs: [{name: plate, resource_type: well_plate}]
      outputs:
        - {name: plate, resource_type: well_plate, same_identity_as: plate}
    resource_claims: &robot_claim
      - {resource_ref: AI4C_robot_arm, resource_type: robotic_arm, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: &move_timing {estimated_duration_s: 30, timeout_s: 300}
    recovery: *ai4c_recovery

  - id: pick_well_plate_from_pipetting_station
    description: 从移液站取孔板。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery

  - id: place_well_plate_to_magnetic_stirrer
    description: 将孔板放到磁搅站。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery

  - id: pick_well_plate_from_magnetic_stirrer
    description: 从磁搅站取孔板。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery

  - id: place_well_plate_to_hplc_station
    description: 将孔板放到 HPLC 工位。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery

  - id: pick_well_plate_from_hplc_station
    description: 从 HPLC 工位取孔板。
    execution_kind: device_macro
    params: []
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery

  - id: place_well_plate_to_unloading_rack
    description: 将孔板放到下料架指定位置。
    execution_kind: device_macro
    params:
      - {name: position, type: integer, required: true, minimum: 1, maximum: 8}
    results: [{name: success, type: boolean}]
    material: *plate_move
    resource_claims: *robot_claim
    timing: *move_timing
    recovery: *ai4c_recovery
