  access: enterprise_login_required
  fallback: styx/dev .cursor/skills/add-device/SKILL.md self-contained rules plus current template schemas
capture:
  committed_presets: 11
  committed_legacy_workflows: 6
  live_browser_draft_found: false
  note: 定向检查当前调试目录和浏览器/e2e 持久化位置，未发现可归属到该项目的活动 localStorage 草稿。
action_reference_migration:
  legacy_rule: auto-<method>
  current_rule: <method>
  reason: Python AST 工作流通过 device("<device_id>").<method>(...) 表达，动作名必须是合法 Python 属性。

