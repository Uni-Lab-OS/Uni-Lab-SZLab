schema_version: 2
device:
  id: szlab_poly_studio
  display_name: 苏州聚合物实验工作站
  category: [workstation, synthesis]
actions:
  - id: run_stirring
    description: 在 S04 执行磁搅与控温。
    execution_kind: device_macro
    params:
      - {name: position, type: integer, required: true, minimum: 1, maximum: 6}
      - {name: speed, type: number, required: true}
      - {name: temperature, type: number, required: true}
      - {name: duration, type: number, required: true}
    results: [{name: success, type: boolean}]
    material:
      mode: pass_through
      inputs: [{name: vessel, resource_type: szlab_beaker_500ml}]
      outputs:
        - {name: vessel, resource_type: szlab_beaker_500ml, same_identity_as: vessel}
    resource_claims:
      - {resource_ref: s04, resource_type: stirrer_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 60, timeout_s: 600}
    recovery: &physical_recovery
      idempotency: reconcile_before_retry
      cancel: reconcile_required
      timeout: reconcile_required
      disconnect: reconcile_required
      estop: needs_drain

  - id: take_photo
    description: 在 S05 获取样品图像并执行检测。
    execution_kind: device_macro
    params:
      - {name: sample_id, type: string, required: true}
    results:
      - {name: success, type: boolean}
      - {name: result, type: object}
    material:
      mode: observe
      inputs: [{name: sample, resource_type: szlab_beaker_500ml}]
      outputs:
        - {name: sample, resource_type: szlab_beaker_500ml, same_identity_as: sample}
    resource_claims:
      - {resource_ref: s05, resource_type: imaging_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 30, timeout_s: 300}
    recovery: *physical_recovery

  - id: run_solvent_addition
    description: 在 S06 由注射泵向烧杯加入指定体积溶液。
    execution_kind: device_macro
    params:
      - {name: pump, type: integer, required: true, minimum: 1, maximum: 3}
      - {name: volume, type: number, required: true, minimum: 0}
    results: [{name: success, type: boolean}]
    material:
      mode: transform
      inputs:
        - {name: vessel, resource_type: szlab_beaker_500ml}
        - {name: reagent, resource_type: szlab_liquid_reagent_bottle_100ml}
      outputs:
        - {name: vessel, resource_type: szlab_beaker_500ml, same_identity_as: vessel}
    resource_claims:
      - {resource_ref: s06, resource_type: liquid_addition_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 90, timeout_s: 600}
    recovery: *physical_recovery

  - id: dose_powder
    description: 在 S07 扫码定位粉罐并向目标容器注粉。
    execution_kind: device_macro
    params:
      - {name: cartridge_position, type: integer, required: true, minimum: 1, maximum: 10}
      - {name: target_weight, type: number, required: true, minimum: 0}
    results: [{name: success, type: boolean}]
    material:
      mode: transform
      inputs:
        - {name: vessel, resource_type: szlab_beaker_500ml}
        - {name: powder, resource_type: szlab_powder_container}
      outputs:
        - {name: vessel, resource_type: szlab_beaker_500ml, same_identity_as: vessel}
    resource_claims:
      - {resource_ref: s07, resource_type: solid_addition_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 120, timeout_s: 600}
    recovery: *physical_recovery

  - id: process_cap
    description: 在 S08 对指定样品瓶执行开盖或关盖。
    execution_kind: device_macro
    params:
      - {name: operation, type: string, required: true}
      - {name: vial_type, type: string, required: true}
      - {name: sample_id_1, type: integer, required: true}
      - {name: sample_id_2, type: integer, required: true}
      - {name: sample_id_3, type: integer, required: true}
    results: [{name: success, type: boolean}]
    material:
      mode: transform
      inputs: [{name: vial, resource_type: szlab_sample_vial_250ml}]
      outputs:
        - {name: vial, resource_type: szlab_sample_vial_250ml, same_identity_as: vial}
    resource_claims:
      - {resource_ref: s08, resource_type: cap_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 60, timeout_s: 600}
    recovery: *physical_recovery

  - id: add_liquid
    description: 在 S09 使用枪头从液体试剂瓶向样品瓶移液。
    execution_kind: device_macro
    params:
      - {name: liquid_bottle_index, type: integer, required: true, minimum: 1, maximum: 5}
      - {name: volume_ul, type: number, required: true, minimum: 0}
    results: [{name: success, type: boolean}]
    material:
      mode: transform
      inputs:
        - {name: vial, resource_type: szlab_sample_vial_250ml}
        - {name: reagent, resource_type: szlab_liquid_reagent_bottle_100ml}
        - {name: tip, resource_type: szlab_pipette_tip}
      outputs:
        - {name: vial, resource_type: szlab_sample_vial_250ml, same_identity_as: vial}
    resource_claims:
      - {resource_ref: s09, resource_type: pipetting_station, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 90, timeout_s: 600}
    recovery: *physical_recovery

  - id: move_material
    description: 使用 S01-S11 机械臂动作在工位和 warehouse 之间搬运物料。
    execution_kind: device_macro
    params:
      - {name: source, type: string, required: true}
      - {name: target, type: string, required: true}
      - {name: position, type: integer, required: true}
    results: [{name: success, type: boolean}]
    material:
      mode: move
      inputs: [{name: material, resource_type: szlab_transportable_material}]
      outputs:
        - {name: material, resource_type: szlab_transportable_material, same_identity_as: material}
    resource_claims:
      - {resource_ref: robot, resource_type: robotic_arm, selector: bound_profile_resource, scope: action, mode: exclusive}
    timing: {estimated_duration_s: 45, timeout_s: 300}
    recovery: *physical_recovery
