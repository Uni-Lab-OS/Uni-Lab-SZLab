[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szlab-poly-studio"
version = "0.1.0"
description = "SZLab polymer-studio domain device package for Uni-Lab-OS"
requires-python = ">=3.11"
dependencies = [
  "opcua>=0.98.13",
  "pylabrobot>=0.1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
runtime = ["unilabos>=0.11.3"]
dev = [
  "build>=1.2",
  "jsonschema>=4.21",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["szlab_poly_studio*"]

[tool.setuptools.package-data]
szlab_poly_studio = [
  "**/*.csv",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.xacro",
  "**/*.urdf",
  "**/*.stl",
  "**/*.dae",
  "**/*.obj",
  "**/*.mtl",
  "**/*.gltf",
  "**/*.glb",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
